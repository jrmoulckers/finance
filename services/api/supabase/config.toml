# Supabase CLI project configuration
# See: https://supabase.com/docs/guides/cli/config

project_id = "finance-local"

[api]
enabled = true
port = 54321
schemas = ["public", "auth", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ---------------------------------------------------------------------------
# External OAuth providers (#3187)
#
# Social sign-in (Google / GitHub / Apple) fails in the deployed environment
# with "Unsupported provider: provider is not enabled" because GoTrue has these
# providers disabled/unconfigured. The buttons and the auth-oauth-start Edge
# Function already support all three in code; what's missing is *enablement +
# credentials* in the deployed Supabase Auth instance.
#
# These sections declare the providers and wire their credentials to
# environment variables (never commit real secrets). They ship DISABLED so
# local `supabase start` keeps working without OAuth apps. To turn a provider
# on, provide the matching secrets in the deployed environment and flip
# `enabled = true` (or enable it in the Supabase dashboard). See
# services/api/docs/oauth-providers.md → "Needs Human Action".
#
# Each provider's authorized redirect URL must be
#   ${OAUTH_REDIRECT_BASE}/api/auth/oauth-callback
# ---------------------------------------------------------------------------

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""

# ---------------------------------------------------------------------------
# Edge Functions (#1886) — cookie-bearing auth proxy
#
# `verify_jwt = false` because these functions enforce their own auth via
# the HttpOnly `finance_refresh` cookie (or accept anonymous traffic for
# login/signup/OAuth start). Letting Kong validate a JWT would reject
# requests that legitimately have no Authorization header.
# ---------------------------------------------------------------------------

[functions.auth-login]
verify_jwt = false

[functions.auth-signup]
verify_jwt = false

[functions.auth-refresh]
verify_jwt = false

[functions.auth-logout]
verify_jwt = false

[functions.auth-oauth-start]
verify_jwt = false

[functions.auth-oauth-callback]
verify_jwt = false

[functions.feedback]
verify_jwt = false

# RevenueCat authenticates provider callbacks with dedicated secrets. Native
# confirmation keeps gateway JWT verification enabled (the default) and also
# resolves auth.uid() in the function before any provider lookup.
[functions.revenuecat-webhook]
verify_jwt = false

[functions.revenuecat-reconcile]
verify_jwt = false

# Stripe web/direct-Windows endpoints verify authenticated requests inside the
# function. Provider callbacks instead require Stripe's raw-body signature.
[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-portal]
verify_jwt = false

[functions.stripe-reconcile]
verify_jwt = false

[functions.stripe-status]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
