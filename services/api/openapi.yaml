  # =========================================================================
  # Account Deletion
  # =========================================================================
  /account-delete:
    delete:
      operationId: deleteAccount
      summary: Delete user account (GDPR Article 17)
      description: >-
        Permanently deletes the authenticated user's account. The web route
        `/api/account` proxies to this Edge Function. The handler
        crypto-shreds encryption keys, cascade-deletes user-owned rows,
        removes sole-owned household data, deletes the Supabase Auth user,
        clears auth cookies, and returns 204 with no response body.

        **This action is irreversible.**
      tags: [Data Management]
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
            examples:
              confirmation:
                summary: Confirm with typed DELETE token
                value:
                  confirmation: DELETE
      responses:
        '204':
          description: Account and associated user-owned data deleted.
        '400':
          description: Missing or invalid confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Type DELETE to confirm account deletion
        '401':
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Authentication required'
        '405':
          description: Method not allowed (non-DELETE request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Method not allowed'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Internal server error'

  # =========================================================================
  # Data Export
  # =========================================================================
  /data-export:
    get:
      operationId: exportData
      summary: Export user data (GDPR Article 20)
      description: >-
        Exports all of the authenticated user's data across all their
        households in either **JSON** or **CSV** format.  The response is
        streamed as a file download.

        ### Exported tables

        | Table                | Scope       |
        | -------------------- | ----------- |
        | `users`              | Own row     |
        | `households`         | Member of   |
        | `household_members`  | Member of   |
        | `accounts`           | Household   |
        | `categories`         | Household   |
        | `transactions`       | Household   |
        | `budgets`            | Household   |
        | `goals`              | Household   |
        | `passkey_credentials`| Own rows    |

        Sensitive columns (e.g. `public_key`) are redacted to
        `[REDACTED]`.

        ### Rate limiting

        Maximum **10 exports per user per hour** (tracked in
        `data_export_audit_log`).

        ### Monetary values

        All monetary values in the export are integers in **cents**.
        For example, `$12.34` is represented as `1234`.
      tags: [Data Management]
      security:
        - BearerJWT: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: >-
            Export format.  Defaults to `json`.  Alternatively, set the
            `Accept` header to `text/csv` to receive CSV.
      responses:
        '200':
          description: >-
            Data export file.  Delivered as a streaming download with
            `Content-Disposition: attachment`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportJsonResponse'
            text/csv:
              schema:
                type: string
                description: >-
                  CSV output with sections separated by `# Table: <name>`
                  comment headers.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: >-
                Suggested filename, e.g.
                `attachment; filename="finance-export-2025-07-15T10-30-00-000Z.json"`.
              example: 'attachment; filename="finance-export-2025-07-15T10-30-00-000Z.json"'
        '400':
          description: Invalid export format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
              example:
                error:
                  code: INVALID_FORMAT
                  message: 'Export format must be "json" or "csv". Use ?format=json or ?format=csv.'
        '401':
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Authentication required'
        '405':
          description: Method not allowed (non-GET request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Method not allowed'
        '413':
          description: Request entity too large (Content-Length exceeds 1 KB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
              example:
                error:
                  code: REQUEST_TOO_LARGE
                  message: 'Request exceeds maximum allowed size.'
        '429':
          description: Rate limit exceeded (10 exports per hour).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
              example:
                error:
                  code: RATE_LIMITED
                  message: 'Export limit exceeded. Maximum 10 exports per hour.'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: 'An unexpected error occurred.'

  # =========================================================================
  # Sync Health Report
  # =========================================================================
  /sync-health-report:
    post:
      operationId: submitSyncHealthReport
      summary: Submit a sync health report
      description: >-
        Accepts sync health metrics from an authenticated client after a
        sync operation completes (successfully or not).  The report is
        validated, sanitized (error messages are scrubbed of potential PII
        and financial data), and inserted into `sync_health_logs` using the
        service role.

        Clients should call this endpoint after every sync round-trip so
        the server can monitor sync performance, detect degradation, and
        alert on recurring failures.

        ### Rate limiting

        Maximum **60 reports per user per hour** (approximately 1 per
        minute).  Excess reports receive a `429` response.

        ### Security

        - `error_message` is sanitized server-side before storage — PII,
          financial amounts, tokens, and identifiers are redacted.
        - The raw `error_message` is **never** logged on the server.
      tags: [Sync]
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncHealthReportRequest'
            example:
              device_id: 'device-abc123'
              sync_duration_ms: 1250
              record_count: 42
              sync_status: success
      responses:
        '201':
          description: Sync health report recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncHealthReportResponse'
              example:
                id: 'c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f'
                created_at: '2025-07-15T10:30:00.000Z'
        '400':
          description: >-
            Invalid request body — missing required fields, type
            mismatches, or values out of allowed range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingDeviceId:
                  summary: Missing device_id
                  value:
                    error: 'device_id is required and must be a non-empty string'
                invalidDuration:
                  summary: Duration out of range
                  value:
                    error: 'sync_duration_ms must be at most 3600000'
                invalidStatus:
                  summary: Invalid sync status
                  value:
                    error: 'sync_status must be one of: success, failure, partial'
                invalidJson:
                  summary: Malformed JSON body
                  value:
                    error: 'Invalid JSON in request body'
        '401':
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Authentication required'
        '405':
          description: Method not allowed (non-POST request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Method not allowed'
        '429':
          description: Rate limit exceeded (60 reports per hour).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Rate limit exceeded. Maximum 60 reports per hour.'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Internal server error'

  # =========================================================================
  # Process Recurring Transactions
  # =========================================================================
  /process-recurring:
    post:
      operationId: processRecurring
      summary: Generate transactions from recurring templates
      description: >-
        Server-to-server endpoint that generates transaction instances from
        all active recurring templates whose `next_due_date` is on or before
        the given `as_of_date` (defaults to today).


        Designed to be called by a cron scheduler (pg_cron, external cron,
        or manual invocation for testing).  Authenticates via `CRON_SECRET`
        shared secret, **not** user JWT.


        The underlying `generate_recurring_transactions` PL/pgSQL function
        uses `FOR UPDATE SKIP LOCKED` for safe concurrent execution.
      tags: [Recurring]
      security:
        - CronSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRecurringRequest'
            example:
              as_of_date: '2026-03-23'
      responses:
        '200':
          description: >-
            Recurring transactions processed successfully.  Returns a
            summary of how many transactions were generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRecurringResponse'
              example:
                ok: true
                generated_count: 5
                as_of_date: '2026-03-23'
                generated_at: '2026-03-23T02:00:00.000Z'
        '400':
          description: Invalid request body or `as_of_date` format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Invalid as_of_date format. Expected ISO 8601 date: YYYY-MM-DD.'
        '401':
          description: Missing or invalid `CRON_SECRET` in Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Unauthorized'
        '405':
          description: Method not allowed (non-POST request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Method not allowed'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Internal server error'
