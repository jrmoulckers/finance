# =============================================================================
# Copilot Setup Steps — agent environment bootstrap
# =============================================================================
#
# Validates the coding-agent environment and keeps the repo-specific setup steps discoverable in GitHub Actions.
# =============================================================================
name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate workspace
        run: |
          echo "✅ Node.js $(node --version)"
          echo "✅ npm $(npm --version)"
          echo "✅ Workspace ready for Copilot coding agent"

      # Future setup steps (uncomment as platforms are added):
