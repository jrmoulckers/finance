# =============================================================================
# Security CI — CodeQL, secret scanning, and dependency audit
# =============================================================================
#
# Combines the repo-wide security scanners with scheduled dependency and license auditing so security checks live in one focused workflow.
# =============================================================================
name: CI — Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 5 * * 3'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to fail dependency audit on (low, moderate, high, critical)'
        required: false
        type: choice
        default: high
        options:
          - low
          - moderate
          - high
          - critical

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

env:
  AUDIT_SEVERITY: ${{ github.event.inputs.severity || 'high' }}

jobs:
  codeql-java-kotlin:
    name: CodeQL Analysis (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BLOCKING (#2860): security SAST must fail the build, not be advisory.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            kotlin:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/build.gradle*'
              - 'gradle/**'
              - 'settings.gradle*'
      - if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: java-kotlin
          queries: +security-and-quality
      - if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
      - if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        run: ./gradlew clean compileKotlinJvm --no-daemon --no-build-cache
      - if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: '/language:java-kotlin'

  codeql-javascript:
    name: CodeQL Analysis (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: '/language:javascript-typescript'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    # BLOCKING (#2860): supply-chain review must block on high-severity findings.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # jdom2 GHSA-2363-cqg2-863c (CVE-2021-33813, XXE) is mitigated at build time:
          # build.gradle.kts force-resolves org.jdom:jdom2 to the patched 2.0.6.1 via
          # resolutionStrategy. dependency-review reads the declared graph (transitive
          # 2.0.6), not the Gradle useVersion force, so this is a false positive. See #3057.
          allow-ghsas: GHSA-2363-cqg2-863c
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLOCKING (#2877): this job must fail the build when secrets are found.
    # It is intentionally NOT continue-on-error.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: TruffleHog (verified + unverified secrets)
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          # #2877: do NOT use --only-verified. We want unverified/unknown
          # results to block too, since an unverified credential is still a
          # leaked credential. The trufflehog action already appends `--fail`
          # internally, so any result (verified or unknown) fails this job.
          extra_args: --results=verified,unknown

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLOCKING (#2877): primary secret-scanning gate. Uses the repo .gitleaks.toml.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history is required so gitleaks can scan the PR commit range.
          fetch-depth: 0
      - name: Run gitleaks
        # Pin verified 2026-06-21: ff98106e is the commit tagged v2.3.9 on
        # gitleaks/gitleaks-action (prior pin 44c470ff was an untagged commit).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Path to the committed config (extends gitleaks defaults).
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE is only required for GitHub Organizations. For a
          # personal repo it can be omitted; left here so an org admin can wire
          # it via Actions secrets without editing this workflow.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile integrity
        run: |
          echo "### 🔒 Lockfile Integrity" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing — lockfile is required for reproducible builds"
            echo "❌ **package-lock.json is missing.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          npm ci
          echo "✅ Lockfile is present and consistent with package.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Run npm audit
        id: npm-audit
        run: |
          echo "### 📦 npm Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          EFFECTIVE_SEVERITY="${AUDIT_SEVERITY}"

          set +e
          AUDIT_OUTPUT=$(npm audit --audit-level="${EFFECTIVE_SEVERITY}" 2>&1)
          AUDIT_EXIT=$?
          set -e

          echo "$AUDIT_OUTPUT"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$AUDIT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ $AUDIT_EXIT -ne 0 ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ **npm audit found vulnerabilities at or above \`${EFFECTIVE_SEVERITY}\` severity.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ No vulnerabilities found at or above \`${EFFECTIVE_SEVERITY}\` severity." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate npm audit SARIF
        if: always()
        run: |
          set +e
          npm audit --json > npm-audit.json 2>&1
          set -e

          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const sarif = {
            $schema:
              'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json',
            version: '2.1.0',
            runs: [
              {
                tool: {
                  driver: {
                    name: 'npm-audit',
                    informationUri: 'https://docs.npmjs.com/cli/v10/commands/npm-audit',
                    rules: [],
                  },
                },
                results: [],
              },
            ],
          };
          const vulns = audit.vulnerabilities || {};
          const ruleIds = new Set();
          for (const [name, vuln] of Object.entries(vulns)) {
            const via = Array.isArray(vuln.via) ? vuln.via : [vuln.via];
            for (const v of via) {
              if (typeof v !== 'object' || !v.url) continue;
              const ruleId = v.source ? String(v.source) : name;
              if (!ruleIds.has(ruleId)) {
                ruleIds.add(ruleId);
                sarif.runs[0].tool.driver.rules.push({
                  id: ruleId,
                  shortDescription: { text: v.title || name },
                  helpUri: v.url || '',
                  properties: { severity: v.severity || vuln.severity || 'info' },
                });
              }
              sarif.runs[0].results.push({
                ruleId,
                level:
                  v.severity === 'critical' || v.severity === 'high'
                    ? 'error'
                    : v.severity === 'moderate'
                      ? 'warning'
                      : 'note',
                message: {
                  text: `${v.title || 'Vulnerability'} in ${name}@${vuln.range || 'unknown'} — ${v.url || 'no advisory'}`,
                },
                locations: [
                  {
                    physicalLocation: {
                      artifactLocation: { uri: 'package-lock.json' },
                      region: { startLine: 1 },
                    },
                  },
                ],
              });
            }
          }
          fs.writeFileSync('npm-audit.sarif', JSON.stringify(sarif, null, 2));
          NODE

      - name: Upload npm audit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        continue-on-error: true
        with:
          sarif_file: npm-audit.sarif
          category: npm-audit

      - name: Fail on vulnerabilities
        if: steps.npm-audit.outputs.result == 'failure'
        run: |
          echo "::error::npm audit found vulnerabilities at or above ${AUDIT_SEVERITY} severity"
          exit 1

  gradle-dependency-check:
    name: Gradle Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BLOCKING (#2860): vulnerable Gradle deps and dynamic versions must fail CI.

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: generate

      - name: Cache Kotlin/Native prebuilt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Verify Gradle version pinning
        run: |
          RANGE_ISSUES=0
          while IFS= read -r line; do
            if echo "$line" | grep -qE '^\s*(#|$|\[)'; then continue; fi
            if echo "$line" | grep -qE '=\s*"'; then
              VERSION=$(echo "$line" | sed -n 's/.*=\s*"\([^"]*\)".*/\1/p')
              if [ -z "$VERSION" ]; then continue; fi
              if echo "$VERSION" | grep -qE '(\+|\[|\]|\(|\)|latest|SNAPSHOT|RELEASE)'; then
                echo "::error::Dynamic version found in libs.versions.toml: $line"
                RANGE_ISSUES=$((RANGE_ISSUES + 1))
              fi
            fi
          done < gradle/libs.versions.toml

          if [ $RANGE_ISSUES -ne 0 ]; then
            exit 1
          fi

      - name: Verify Gradle dependency checksums
        run: |
          ./gradlew dependencies --configuration runtimeClasspath --no-daemon 2>&1 | tee gradle-deps.txt || true

      - name: Scan for vulnerable Gradle dependencies
        id: gradle-scan
        run: |
          ./gradlew :packages:core:dependencies :packages:models:dependencies :packages:sync:dependencies \
            --configuration runtimeClasspath --no-daemon 2>&1 | tee gradle-all-deps.txt || true

          ISSUES=0
          if grep -i "log4j-core:2\.[0-9]\." gradle-all-deps.txt 2>/dev/null; then ISSUES=$((ISSUES + 1)); fi
          if grep -i "commons-text:1\.\([0-9]\|10\)\." gradle-all-deps.txt 2>/dev/null; then ISSUES=$((ISSUES + 1)); fi
          if grep -i "snakeyaml:1\." gradle-all-deps.txt 2>/dev/null; then ISSUES=$((ISSUES + 1)); fi
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-dependency-report
          path: |
            gradle-deps.txt
            gradle-all-deps.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Fail on vulnerable Gradle dependencies
        # BLOCKING (#2860): if known-vulnerable artifacts are on the classpath the
        # job must fail instead of silently reporting via continue-on-error.
        run: |
          ISSUES="${{ steps.gradle-scan.outputs.issues }}"
          echo "### 🐘 Gradle Dependency Check" >> "$GITHUB_STEP_SUMMARY"
          if [ "${ISSUES:-0}" -ne 0 ]; then
            echo "::error::Found ${ISSUES} known-vulnerable Gradle dependency pattern(s) on the runtime classpath"
            echo "❌ Found **${ISSUES}** known-vulnerable Gradle dependency pattern(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ No known-vulnerable Gradle dependency patterns detected." >> "$GITHUB_STEP_SUMMARY"

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check npm license compliance
        run: |
          npx license-checker --production --summary --out license-summary.txt 2>/dev/null || {
            npm ls --all --json 2>/dev/null | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              const denied = ['GPL-3.0', 'AGPL-3.0', 'GPL-3.0-only', 'AGPL-3.0-only', 'GPL-3.0-or-later', 'AGPL-3.0-or-later'];
              function walk(deps, path) {
                if (!deps) return [];
                const issues = [];
                for (const [name, info] of Object.entries(deps)) {
                  const lic = (info.license || info.licenses || 'unknown').toString();
                  for (const d of denied) {
                    if (lic.includes(d)) issues.push({ pkg: name, license: lic, path: path + '/' + name });
                  }
                  issues.push(...walk(info.dependencies, path + '/' + name));
                }
                return issues;
              }
              const issues = walk(data.dependencies || {}, '');
              if (issues.length > 0) {
                console.error('DENIED_LICENSES=' + JSON.stringify(issues));
                process.exit(1);
              } else {
                console.log('No denied licenses found.');
              }
            "
          }

  summary:
    name: Security Summary
    needs:
      [
        codeql-java-kotlin,
        codeql-javascript,
        dependency-review,
        secret-scanning,
        gitleaks,
        npm-audit,
        gradle-dependency-check,
        license-check,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Aggregate results
        run: |
          echo "### 🔐 Security Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL (JVM) | ${{ needs.codeql-java-kotlin.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL (JS/TS) | ${{ needs.codeql-javascript.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency review | ${{ needs.dependency-review.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret detection (TruffleHog) | ${{ needs.secret-scanning.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret scan (gitleaks) | ${{ needs.gitleaks.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| npm audit | ${{ needs.npm-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gradle dependency check | ${{ needs.gradle-dependency-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| License compliance | ${{ needs.license-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Audit severity threshold:** \`${{ env.AUDIT_SEVERITY }}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.npm-audit.result }}" = "failure" ]; then
            echo "::error::Security workflow failed because npm audit reported vulnerabilities"
            exit 1
          fi

          if [ "${{ needs.license-check.result }}" = "failure" ]; then
            echo "::error::Security workflow failed because the license check failed"
            exit 1
          fi

  # ===========================================================================
  # Gatekeeper — the single, ALWAYS-ON required status check (#2860 / #2876)
  # ===========================================================================
  # This workflow has no `paths:` filter, so this job runs on EVERY push and PR
  # to `main`. Branch protection can require this one check; it aggregates the
  # blocking security jobs above AND independently runs lint + format + a secret
  # scan so the required check is never "missing" on path-filtered PRs (which is
  # what previously let changes merge without ever running these gates).
  gatekeeper:
    name: Required Checks Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    needs:
      - codeql-java-kotlin
      - codeql-javascript
      - dependency-review
      - secret-scanning
      - gitleaks
      - npm-audit
      - gradle-dependency-check
      - license-check
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Always-on lint + format gate (ci-lint.yml is path-filtered and may be
      # skipped, so we re-run the essentials here to guarantee coverage).
      - name: Format check (prettier)
        run: npx prettier --check .

      - name: ESLint
        run: npx eslint . --max-warnings 0

      # Always-on lightweight secret scan as a backstop to the dedicated jobs.
      - name: Secret backstop (tracked files)
        run: |
          PATTERN='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN[ A-Z]*PRIVATE KEY-----|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|sk_live_[0-9A-Za-z]{16,}'
          if git grep -nIE "$PATTERN" -- ':!*__tests__*' ':!*.test.*' ':!*.spec.*' ':!docs/*' ':!.gitleaks.toml' 2>/dev/null; then
            echo "::error::Potential hard-coded secret detected by gatekeeper backstop scan"
            exit 1
          fi
          echo "✅ Gatekeeper secret backstop found no matches."

      # Always-on sensitive-data-logging backstop (#2876). The full check lives in
      # ci-lint.yml's "Observability Guardrails" job, but that workflow is
      # path-filtered; this compact mirror guarantees the gate runs on every PR.
      - name: Sensitive-data-logging backstop
        run: |
          PATTERNS='password|access_token|refresh_token|api_key|apiKey|secret|creditCard|credit_card|ssn|social_security'
          HITS=$(grep -rnE "console\.|log\.|logger\.|Log\." \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --include='*.kt' --include='*.swift' \
            apps/ packages/ services/ 2>/dev/null \
            | grep -Ei "$PATTERNS" \
            | grep -v '\.test\.' \
            | grep -v '\.spec\.' \
            | grep -v 'node_modules' \
            | grep -v '// SAFE:' \
            | grep -v '# nosec' \
            || echo "")
          if [ -n "$HITS" ]; then
            COUNT=$(printf '%s\n' "$HITS" | wc -l)
            echo "::error::Potential sensitive-data logging detected ($COUNT occurrence(s))"
            printf '%s\n' "$HITS" | head -20
            exit 1
          fi
          echo "✅ Gatekeeper sensitive-data-logging backstop found no matches."

      - name: Aggregate required security checks
        if: always()
        env:
          CODEQL_JVM: ${{ needs.codeql-java-kotlin.result }}
          CODEQL_JS: ${{ needs.codeql-javascript.result }}
          DEP_REVIEW: ${{ needs.dependency-review.result }}
          SECRET_TRUFFLEHOG: ${{ needs.secret-scanning.result }}
          SECRET_GITLEAKS: ${{ needs.gitleaks.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          GRADLE_DEP: ${{ needs.gradle-dependency-check.result }}
          LICENSE: ${{ needs.license-check.result }}
        run: |
          echo "### 🛡️ Gatekeeper — required checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Required check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          # 'skipped' is acceptable: e.g. dependency-review only runs on PRs and
          # CodeQL/JVM steps may no-op when no Kotlin changed. 'failure' /
          # 'cancelled' must block.
          check() {
            name="$1"; result="$2"
            echo "| $name | $result |" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Required check '$name' did not pass (result: $result)"; fail=1 ;;
            esac
          }
          check "CodeQL (java-kotlin)" "$CODEQL_JVM"
          check "CodeQL (javascript-typescript)" "$CODEQL_JS"
          check "Dependency Review" "$DEP_REVIEW"
          check "Secret Detection (TruffleHog)" "$SECRET_TRUFFLEHOG"
          check "Secret Scan (gitleaks)" "$SECRET_GITLEAKS"
          check "npm Audit" "$NPM_AUDIT"
          check "Gradle Dependency Check" "$GRADLE_DEP"
          check "License Compliance" "$LICENSE"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "❌ Gatekeeper failing — one or more required security checks did not pass." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ All required security checks passed." >> "$GITHUB_STEP_SUMMARY"
