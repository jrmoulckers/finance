# =============================================================================
# AI Eval — golden-task scorecard for agent output (scaffold, non-blocking)
# =============================================================================
#
# Runs the agent-output eval scaffold (tools/ai-eval/run-evals.js) against the
# golden-task fixtures whenever agent or skill definitions change. This is
# NON-BLOCKING initially: the runner exits 0 and surfaces a scorecard in the job
# summary. Flip to blocking later by setting STRICT=1 once the real agent runner
# (see the TODO(human) in run-evals.js) is wired and thresholds are calibrated.
#
# Addresses audit issue #2862.
# =============================================================================
name: AI Eval

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - 'tools/ai-eval/**'
  workflow_dispatch:

concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: Golden-Task Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3 (verified 2026-06-21)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (verified 2026-06-21)
        with:
          node-version: 22

      - name: Run evals (non-blocking scaffold)
        # STRICT is intentionally unset: the scaffold reports a scorecard but
        # does not gate merges until the agent runner is wired.
        run: node tools/ai-eval/run-evals.js
