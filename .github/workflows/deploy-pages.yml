# =============================================================================
# Deploy — Web (GitHub Pages)
# =============================================================================
#
# A zero-infrastructure auto-deploy for the local-first web app. The app is a
# static SPA (vite build) that works without a backend (local-first / demo
# mode), so it can be served directly from GitHub Pages with no external host
# or secrets.
#
# Trigger: automatically after a green **Web CI** run on `main` (so only
# validated commits ship), plus manual workflow_dispatch.
#
# Build env:
#   - PUBLIC_BASE_PATH=/finance/  -> vite base + router basename for the
#     project-pages subpath (https://<owner>.github.io/finance/).
#   - VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY: mapped from the SUPABASE_URL /
#     SUPABASE_ANON_KEY repo secrets when present (backend-connected). When the
#     secrets are absent (e.g. forks) a `placeholder` URL activates local-first /
#     demo mode so the app still builds and works.
#   - VITE_POWERSYNC_URL: mapped from the POWERSYNC_URL repo secret to enable
#     live sync; unset -> local-first only.
# =============================================================================

name: Deploy — Web (Pages)

on:
  workflow_run:
    workflows: ['Web CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; let in-flight ones finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Pages)
    # Only deploy when manually dispatched or when the triggering Web CI was green.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -w packages/design-tokens

      - name: Build web app (Pages subpath)
        env:
          PUBLIC_BASE_PATH: /finance/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          VITE_POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          # Enable the live PowerSync client only when a real backend URL is
          # configured; otherwise keep it off so @powersync/web is tree-shaken.
          VITE_POWERSYNC_ENABLED: ${{ secrets.POWERSYNC_URL != '' && 'true' || 'false' }}
        run: npm run build -w apps/web

      - name: SPA fallback + Pages hygiene
        run: |
          # Client-side routing: serve index.html for unknown deep links.
          cp apps/web/dist/index.html apps/web/dist/404.html
          # Disable Jekyll so files/dirs starting with '_' are served as-is.
          touch apps/web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: Deploy (Pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
