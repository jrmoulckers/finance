# =============================================================================
# Housekeeping — project automation, stale detection, and uptime checks
# =============================================================================
#
# Combines low-risk repository maintenance workflows so issue/project hygiene and uptime monitoring live in one scheduled workflow file.
# =============================================================================
name: Housekeeping

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which housekeeping task to run manually'
        required: false
        type: choice
        default: all
        options:
          - all
          - uptime
          - stale

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: housekeeping-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  add-to-project:
    name: Auto-add to project
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add to project
        if: ${{ env.ADD_TO_PROJECT_PAT != '' }}
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
        with:
          project-url: https://github.com/users/jrmoulckers/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

  stale:
    name: Flag stale issues
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'stale'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          stale-issue-message: >-
            This issue has been inactive for 7 days. If it's still in progress,
            please provide a status update. If it's blocked, add the `blocked`
            label and describe the blocker.
          stale-issue-label: 'stale'
          days-before-stale: 7
          days-before-close: -1
          exempt-issue-labels: 'blocked,spike'
          operations-per-run: 30

  uptime:
    name: Check beta web uptime
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'uptime'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check beta URL with retries
        id: check
        env:
          BETA_UPTIME_URL: ${{ vars.BETA_UPTIME_URL }}
        run: |
          set +e
          if [ -n "${BETA_UPTIME_URL:-}" ]; then
            if [[ "$BETA_UPTIME_URL" == http://* || "$BETA_UPTIME_URL" == https://* ]]; then
              url="${BETA_UPTIME_URL%/}"
            else
              url="https://${BETA_UPTIME_URL%/}"
            fi
          else
            url="https://finance-staging.vercel.app"
          fi
          attempts=3
          delay_seconds=10
          curl_status=0
          status_code=000
          for attempt in $(seq 1 "$attempts"); do
            curl_output=$(curl --silent --show-error --location --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" 2>&1)
            curl_status=$?
            status_code="${curl_output: -3}"
            if [ "$curl_status" -eq 0 ] && [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
              break
            fi
            [ "$attempt" -lt "$attempts" ] && sleep "$delay_seconds"
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "status_code=$status_code" >> "$GITHUB_OUTPUT"
          echo "curl_status=$curl_status" >> "$GITHUB_OUTPUT"
          if [ "$curl_status" -ne 0 ] || [ "$status_code" -lt 200 ] || [ "$status_code" -ge 400 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update uptime issue
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: ${{ steps.check.outputs.url }}
          STATUS_CODE: ${{ steps.check.outputs.status_code }}
          CURL_STATUS: ${{ steps.check.outputs.curl_status }}
        run: |
          set -euo pipefail
          gh label create uptime --repo "$GITHUB_REPOSITORY" --color D73A4A --description "Uptime monitor alerts" --force >/dev/null
          gh label create beta --repo "$GITHUB_REPOSITORY" --color 1D76DB --description "Beta environment" --force >/dev/null
          body="Automated beta uptime check failed.\n\n- URL: ${HEALTH_URL}\n- HTTP status: ${STATUS_CODE}\n- curl exit: ${CURL_STATUS}\n- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n- Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          existing_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime --label beta --json number --jq '.[0].number // empty')
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Beta uptime check failing" --label uptime --label beta --body "$body"
          fi

  prod-uptime:
    name: Check production web uptime
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'uptime'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production DNS + HTTPS with retries
        id: check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set +e
          if [ -n "${PRODUCTION_URL:-}" ]; then
            if [[ "$PRODUCTION_URL" == http://* || "$PRODUCTION_URL" == https://* ]]; then
              url="${PRODUCTION_URL%/}"
            else
              url="https://${PRODUCTION_URL%/}"
            fi
          else
            url="https://finance.jrmoulckers.com"
          fi
          host="${url#*://}"
          host="${host%%/*}"
          host="${host%%:*}"

          # DNS resolution check — catches NXDOMAIN, the #3063 failure mode the
          # beta-only monitor never saw (a missing Cloudflare record).
          resolved_ip="$(getent hosts "$host" | awk '{ print $1; exit }')"
          if [ -n "$resolved_ip" ]; then
            dns_ok=true
          else
            dns_ok=false
          fi

          # HTTPS reachability check with retries.
          attempts=3
          delay_seconds=10
          curl_status=0
          status_code=000
          for attempt in $(seq 1 "$attempts"); do
            curl_output=$(curl --silent --show-error --location --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" 2>&1)
            curl_status=$?
            status_code="${curl_output: -3}"
            if [ "$curl_status" -eq 0 ] && [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
              break
            fi
            [ "$attempt" -lt "$attempts" ] && sleep "$delay_seconds"
          done

          # API health probe: Caddy rewrites /health -> edge-functions /health-check.
          # The static root returns 200 even when the edge-runtime is down, so a
          # root-only check is blind to auth/API outages (#3075, the root cause of
          # the silent signup failure in #3066). A 5xx or connection failure here
          # means edge-functions is unreachable; a 4xx means it responded (a
          # different problem) and is deliberately not treated as a health failure.
          health_url="${url}/health"
          health_curl_status=0
          health_status_code=000
          for attempt in $(seq 1 "$attempts"); do
            health_output=$(curl --silent --show-error --location --max-time 10 --output /dev/null --write-out '%{http_code}' "$health_url" 2>&1)
            health_curl_status=$?
            health_status_code="${health_output: -3}"
            if [ "$health_curl_status" -eq 0 ] && [ "$health_status_code" -ge 200 ] && [ "$health_status_code" -lt 300 ]; then
              break
            fi
            [ "$attempt" -lt "$attempts" ] && sleep "$delay_seconds"
          done

          if [ "$health_curl_status" -ne 0 ] || [ "$health_status_code" -ge 500 ]; then
            health_ok=false
          else
            health_ok=true
          fi

          {
            echo "url=$url"
            echo "host=$host"
            echo "dns_ok=$dns_ok"
            echo "resolved_ip=$resolved_ip"
            echo "status_code=$status_code"
            echo "curl_status=$curl_status"
            echo "health_url=$health_url"
            echo "health_status_code=$health_status_code"
            echo "health_curl_status=$health_curl_status"
            echo "health_ok=$health_ok"
          } >> "$GITHUB_OUTPUT"

          if [ "$dns_ok" != "true" ] || [ "$curl_status" -ne 0 ] || [ "$status_code" -lt 200 ] || [ "$status_code" -ge 400 ] || [ "$health_ok" != "true" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update production uptime issue
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: ${{ steps.check.outputs.url }}
          HEALTH_HOST: ${{ steps.check.outputs.host }}
          DNS_OK: ${{ steps.check.outputs.dns_ok }}
          RESOLVED_IP: ${{ steps.check.outputs.resolved_ip }}
          STATUS_CODE: ${{ steps.check.outputs.status_code }}
          CURL_STATUS: ${{ steps.check.outputs.curl_status }}
          API_HEALTH_URL: ${{ steps.check.outputs.health_url }}
          API_STATUS_CODE: ${{ steps.check.outputs.health_status_code }}
          API_CURL_STATUS: ${{ steps.check.outputs.health_curl_status }}
          API_HEALTH_OK: ${{ steps.check.outputs.health_ok }}
        run: |
          set -euo pipefail
          gh label create uptime --repo "$GITHUB_REPOSITORY" --color D73A4A --description "Uptime monitor alerts" --force >/dev/null
          gh label create infrastructure --repo "$GITHUB_REPOSITORY" --color BFDADC --description "Infrastructure setup and configuration" --force >/dev/null
          if [ "$DNS_OK" != "true" ]; then
            dns_line="- DNS resolution: FAILED — no A record for ${HEALTH_HOST} (NXDOMAIN). Check the Cloudflare DNS record."
          else
            dns_line="- DNS resolution: ok (${HEALTH_HOST} -> ${RESOLVED_IP})"
          fi
          if [ "$API_HEALTH_OK" != "true" ]; then
            api_line="- API health (${API_HEALTH_URL}): FAILED — HTTP ${API_STATUS_CODE}, curl exit ${API_CURL_STATUS}. edge-functions is unreachable, so auth/account/feedback routes are down (the #3066 failure mode)."
          else
            api_line="- API health (${API_HEALTH_URL}): ok (HTTP ${API_STATUS_CODE})"
          fi
          body=$(printf '%s\n' \
            "Automated production uptime check failed." \
            "" \
            "- URL: ${HEALTH_URL}" \
            "${dns_line}" \
            "- Static HTTP status: ${STATUS_CODE}" \
            "- curl exit: ${CURL_STATUS}" \
            "${api_line}" \
            "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')")
          existing_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime --label infrastructure --json number --jq '.[0].number // empty')
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Production uptime check failing" --label uptime --label infrastructure --body "$body"
          fi

      - name: Resolve production uptime issue on recovery
        if: steps.check.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: ${{ steps.check.outputs.url }}
          API_HEALTH_URL: ${{ steps.check.outputs.health_url }}
          API_STATUS_CODE: ${{ steps.check.outputs.health_status_code }}
        run: |
          set -euo pipefail
          # Close the alert automatically once production is healthy again so a
          # resolved incident does not linger open and go stale (#3078). Only the
          # monitor's own uptime+infrastructure alert issue is ever touched, and
          # only when this run observed a fully passing DNS/HTTP/API probe.
          existing_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label uptime --label infrastructure --json number --jq '.[0].number // empty')
          if [ -n "$existing_issue" ]; then
            body=$(printf '%s\n' \
              "✅ Automated production uptime check recovered." \
              "" \
              "- URL: ${HEALTH_URL}" \
              "- API health (${API_HEALTH_URL}): ok (HTTP ${API_STATUS_CODE})" \
              "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "- Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              "" \
              "Closing automatically; a new alert will be opened if the check fails again.")
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue close "$existing_issue" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
