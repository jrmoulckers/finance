# =============================================================================
# AI Manifest Check — detect drift between doc counts and the AI config surface
# =============================================================================
#
# Generates the AI configuration manifest (agents / skills / instructions / MCP
# servers) and checks whether hardcoded counts in docs/ai/README.md,
# docs/INDEX.md and AGENTS.md still match the filesystem.
#
# The check is INFORMATIONAL by default (warns, exits 0) to avoid racing
# concurrent doc edits. To make drift blocking, set STRICT=1 (e.g. flip the env
# below once the docs are stabilized).
#
# Addresses audit issue #2863.
# =============================================================================
name: AI Manifest Check

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - '.vscode/mcp.json'
      - 'docs/ai/README.md'
      - 'docs/INDEX.md'
      - 'AGENTS.md'
      - 'tools/ai-manifest.js'
      - 'tools/check-ai-manifest.js'
  workflow_dispatch:

concurrency:
  group: ai-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3 (verified 2026-06-21)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (verified 2026-06-21)
        with:
          node-version: 22

      - name: Generate manifest
        run: node tools/ai-manifest.js --markdown

      - name: Check for drift (informational)
        # Default is warn-only (exit 0). Set STRICT=1 here to make drift blocking.
        env:
          STRICT: '0'
        run: node tools/check-ai-manifest.js
