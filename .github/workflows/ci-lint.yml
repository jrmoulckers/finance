# =============================================================================
# Lint CI — formatting, semantic PR titles, and observability guardrails
# =============================================================================
#
# Runs the monorepo lint/format checks, validates pull-request titles, and enforces lightweight logging/sourcemap guardrails previously handled by observability checks.
# =============================================================================
name: CI — Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.json'
      - '**/*.css'
      - '**/*.html'
      - '**/*.yaml'
      - '**/*.yml'
      - '.eslintrc*'
      - 'eslint.config.*'
      - '.prettierrc*'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Always runs so the required "ESLint & Prettier" context is reported on every
  # PR. Detects whether lint-relevant paths changed; the lint jobs are skipped —
  # a passing state for required checks — when they did not.
  #
  # GUARDRAIL: do NOT add `paths:`/`paths-ignore:` to this workflow's `on:`
  # triggers. A required check whose workflow is filtered out never reports its
  # status, leaving PRs stuck in a BLOCKED state. Gate inside the workflow via
  # this `changes` detector (skip-with-success) instead. See docs/ops/ci-workflow.md
  # and .github/instructions/workflows.instructions.md.
  changes:
    uses: ./.github/workflows/reusable-detect-changes.yml
    with:
      filters: |
        relevant:
          - '**/*.ts'
          - '**/*.tsx'
          - '**/*.js'
          - '**/*.jsx'
          - '**/*.mjs'
          - '**/*.cjs'
          - '**/*.json'
          - '**/*.css'
          - '**/*.html'
          - '**/*.yaml'
          - '**/*.yml'
          - '.eslintrc*'
          - 'eslint.config.*'
          - '.prettierrc*'
          - '.prettierignore'
          - 'package.json'
          - 'package-lock.json'
          - 'apps/**'
          - 'packages/**'
          - 'services/**'
          - '.github/workflows/ci-lint.yml'
          - '.github/workflows/reusable-detect-changes.yml'

  eslint-prettier:
    name: ESLint & Prettier
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache ESLint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'package-lock.json') }}-
            eslint-${{ runner.os }}-

      - name: ESLint
        run: npx eslint . --max-warnings 0 --cache --cache-location .eslintcache

      - name: Vendored engineering configs match lock
        run: node scripts/vendor-configs.mjs --check

      - name: Prettier
        run: npx prettier --check .

      - name: Validate financial-terminology glossary
        run: node scripts/i18n/validate-glossary.js

      - name: Workflow Node pins agree with .nvmrc
        run: npm run node:version:check

      - name: Gradle jobs prefetch the distribution
        run: npm run gradle:prefetch:check

      - name: Tooling imports are declared
        run: npm run tool:imports:check

      - name: Principle enumerations are cited, not restated
        run: npm run citations:enumerations:check

      - name: Enumeration checker tests
        run: npm run citations:enumerations:test

      - name: Cross-repo refs are pinned
        run: npm run upstream:refs:check

      - name: Documentation links and anchors resolve
        run: npm run docs:links:check

      - name: Tool tests do not reimplement their tools
        run: npm run test:independence:check

      # Runs every tools/*.test.mjs, enumerated from disk. Without this step a test file is
      # enforced only if someone remembers to register a script AND add a workflow step, so a
      # new suite defaults to unenforced -- which is how 270 of 472 tool tests came to be run
      # by no workflow, including the suite for a checker that is itself a required gate.
      - name: Tool test suites
        run: npm run tools:test

      - name: Every script is reachable, or reported unreached
        run: npm run gate:enforcement

      # A bound compared against a bare number can never be contradicted: it excludes some values
      # and names no source. This requires every numeric threshold in tools/ to be either derived
      # from the artifact that already commits to the number, or annotated with why none does.
      - name: Every numeric bound names its source
        run: npm run bounds:check

      # A shared primitive is the one that is imported, and importer count cannot detect a fourth
      # authoring: it reads green on a tree with nothing to import, and it reads a forced hand
      # (CommonJS cannot load the ESM owner) as a decision not to reuse. This censuses independent
      # implementations instead, which needs no extraction to have happened first.
      - name: One definition of a markdown fence
        run: npm run markdown:primitives:check

      # statSync reports a Windows junction as a directory and lstatSync does not, so the ordinary
      # walker descends through a link. This worktree carries three from node_modules/@finance/*
      # back into tracked source; a cleanup that enumerated through one deleted node_modules plus
      # 2,825 tracked files. Every individual delete was by name. The walk that produced the names
      # was not. The exposure is also invisible to PowerShell, which stops at a junction, so it
      # cannot be found by the tool this repository's agents verify cleanliness with (#4349).
      - name: A directory test does not follow a link
        run: npm run walk:safety:check

      # `gate:enforcement` answers whether a gate is wired, which is a property of the workflow
      # files and readable. It cannot answer whether the invoked program can fail, which is
      # behavioural: check-gate-enforcement.mjs was itself wired here and had no exit code at all
      # until #4333, and was found by hand. This executes each gate against a violating fixture and
      # requires the report to name the violation, because a fixture that fails to scaffold also
      # exits non-zero.
      - name: Every declared gate can fail
        run: npm run gate:teeth
  pr-title:
    name: Semantic PR Title
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false

  entitlement-gateway-changes:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-detect-changes.yml
    with:
      filters: |
        relevant:
          - 'services/api/supabase/functions/entitlements-v1/**'
          - 'services/api/supabase/functions/_shared/**'
          - 'services/api/supabase/tests/entitlement-gateway.integration.test.mjs'
          - 'services/api/supabase/config.toml'
          - 'services/api/package.json'
          - '.github/workflows/ci-lint.yml'

  # The `entitlements-v1` contract promises a stable `unauthenticated` envelope
  # with CORS headers and no-store for a missing, malformed, or expired
  # credential. Handler-level unit tests cannot prove that: the gateway decides
  # whether a request reaches the function at all. This job stands up the real
  # local stack and drives it, so a config change that lets the gateway answer
  # first fails here instead of in production. Every prerequisite is mandatory —
  # the suite fails loudly rather than skipping a case.
  entitlement-gateway:
    name: Entitlement Gateway Integration
    needs: entitlement-gateway-changes
    if: ${{ github.event_name != 'pull_request' || needs.entitlement-gateway-changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the Supabase CLI
        run: npm install --global supabase@2.116.0

      - name: Start the local Supabase stack
        working-directory: services/api
        run: |
          supabase start \
            -x studio,imgproxy,logflare,vector,supavisor,mailpit,realtime,storage-api,inbucket

      - name: Serve the Edge Functions
        working-directory: services/api
        # ALLOWED_ORIGINS is a plain local value, not a credential: the suite
        # only ever talks to the loopback stack this job just created.
        run: |
          printf 'ALLOWED_ORIGINS=https://finance.example\n' > "$RUNNER_TEMP/entitlements.env"
          supabase functions serve --env-file "$RUNNER_TEMP/entitlements.env" \
            > "$RUNNER_TEMP/functions-serve.log" 2>&1 &
          # Wait for 401 specifically. A 503 means the function is up but its
          # environment is incomplete, which must not be mistaken for readiness.
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:54321/functions/v1/entitlements-v1 || true)
            if [ "$code" = "401" ]; then
              echo "entitlements-v1 gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the entitlements-v1 gateway did not become ready"
          cat "$RUNNER_TEMP/functions-serve.log"
          exit 1

      - name: Run the gateway integration suite
        run: npm run test:entitlement-gateway -w services/api

      - name: Edge function logs
        if: failure()
        run: cat "$RUNNER_TEMP/functions-serve.log" || true

      - name: Stop the local Supabase stack
        if: always()
        working-directory: services/api
        run: supabase stop --no-backup || true

  observability-guardrails:
    name: Observability Guardrails
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLOCKING / REQUIRED (#2876): the "Check for sensitive data logging" step
    # below fails the build (exit 1) when financial/PII data is logged. This job
    # is intentionally NOT continue-on-error. Note: this workflow is path-filtered,
    # so the gatekeeper job in ci-security.yml runs an always-on backstop of the
    # same check for PRs that don't touch the filtered paths.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for console logging in production code
        # The `|| echo ""` below is load-bearing, not defensive noise: grep exits 1
        # when it matches nothing, which here is the SUCCESS case. Without it the
        # step goes red on a clean repository (and under `-o pipefail`, on any
        # stage of the pipe matching nothing). Verified: clean=0, violation=1,
        # `// SAFE:`=0, `.spec.`=0. Do not "simplify" it away.
        run: |
          CONSOLE_HITS=$(grep -rn 'console\.log\|console\.warn\|console\.error' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            apps/web/src/ services/api/src/ packages/*/src/ 2>/dev/null \
            | grep -v '\.test\.' \
            | grep -v '\.spec\.' \
            | grep -v '__tests__' \
            | grep -v 'node_modules' \
            | grep -v '// eslint-disable' \
            || echo "")

          echo "### 📋 Observability Guardrails" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CONSOLE_HITS" ]; then
            COUNT=$(echo "$CONSOLE_HITS" | wc -l)
            echo "⚠️ Found **$COUNT** raw console logging call(s) in production code." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$CONSOLE_HITS" | head -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Found $COUNT raw console logging call(s) in production code"
          else
            echo "✅ No raw console logging found in production code." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for sensitive data logging
        # See the note on the previous step: the `|| echo ""` absorbs grep's
        # exit 1 (no match), which is this check's success case. Removing it
        # inverts the gate — it would fail on repositories with no violations.
        run: |
          SENSITIVE_PATTERNS=(
            'password'
            'access_token'
            'refresh_token'
            'api_key'
            'apiKey'
            'secret'
            'creditCard'
            'credit_card'
            'ssn'
            'social_security'
          )

          SENSITIVE_VIOLATIONS=0
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            HITS=$(grep -rn "console\.\|log\.\|logger\.\|Log\." \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
              --include='*.kt' --include='*.swift' \
              apps/ packages/ services/ 2>/dev/null \
              | grep -i "$pattern" \
              | grep -v '\.test\.' \
              | grep -v '\.spec\.' \
              | grep -v 'node_modules' \
              | grep -v '// SAFE:' \
              | grep -v '# nosec' \
              || echo "")

            if [ -n "$HITS" ]; then
              COUNT=$(echo "$HITS" | wc -l)
              SENSITIVE_VIOLATIONS=$((SENSITIVE_VIOLATIONS + COUNT))
              echo "::error::Potential sensitive data in logs matching '$pattern' ($COUNT occurrences)"
            fi
          done

          if [ "$SENSITIVE_VIOLATIONS" -eq 0 ]; then
            echo "✅ No sensitive-data logging patterns found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Sensitive-data logging patterns were detected ($SENSITIVE_VIOLATIONS occurrences)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check source map configuration
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Source map configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if grep -r 'sourcemap\|sourceMap\|source-map' apps/web/vite.config.* 2>/dev/null | grep -v node_modules > /dev/null; then
            echo "- ✅ Web: Source maps configured in Vite" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ Web: No source map configuration found" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # ENG-* citation integrity
  # ---------------------------------------------------------------------------
  # Deliberately has NO `needs: changes` gate, unlike every other job in this
  # workflow. The other jobs check finance's files against finance's rules, so
  # "no relevant file changed" genuinely means "nothing to check". This one
  # checks finance's citations against ANOTHER repository's principle index,
  # which moves on its own: an upstream rename can invalidate a citation on a PR
  # that touches nothing at all. Gating it on changed paths would make it absent
  # exactly when it is most needed, which is the always-on backstop pattern
  # already used for the sensitive-logging grep in ci-security.yml.
  #
  # No `npm ci`: the checker is a dependency-free Node script, so the job is
  # checkout + node + run. It fetches the principle index over the network and
  # THROWS on failure (exit 2) rather than reporting success, so an outage is
  # loud. That is deliberate — a verifier that passes when it cannot verify is
  # indistinguishable from one that verified.
  eng-citations:
    name: ENG Citations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Catches a hand-edited vendored file. The checker is vendored from
      # jrmoulckers/engineering at a pinned tag and content-hashed in
      # engineering-configs.lock.json, because upstream's own header says it is
      # "kept nowhere" -- and a local copy declaring the same TOOL_VERSION as a
      # newer upstream one is how finance ran a checker missing a whole check.
      - name: Verify vendored tooling matches the lock
        # GITHUB_TOKEN raises the API limit from 60/hour per IP to 5000/hour per
        # repo. Without it the staleness half of this check is rate-limited off
        # on shared runner IPs, and until it named that gap the skip printed the
        # same green line as a successful check.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run eng:vendor:check

      - name: Vendoring staleness resolution tests
        run: npm run eng:vendor:test

      - name: Check ENG-* citations
        run: npm run eng:citations

      - name: Citation exclusions are explicitly justified
        run: npm run citations:exclusions:check
