# =============================================================================
# Lint CI — formatting, semantic PR titles, and observability guardrails
# =============================================================================
#
# Runs the monorepo lint/format checks, validates pull-request titles, and enforces lightweight logging/sourcemap guardrails previously handled by observability checks.
# =============================================================================
name: CI — Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.json'
      - '**/*.css'
      - '**/*.html'
      - '**/*.yaml'
      - '**/*.yml'
      - '.eslintrc*'
      - 'eslint.config.*'
      - '.prettierrc*'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Always runs so the required "ESLint & Prettier" context is reported on every
  # PR. Detects whether lint-relevant paths changed; the lint jobs are skipped —
  # a passing state for required checks — when they did not.
  #
  # GUARDRAIL: do NOT add `paths:`/`paths-ignore:` to this workflow's `on:`
  # triggers. A required check whose workflow is filtered out never reports its
  # status, leaving PRs stuck in a BLOCKED state. Gate inside the workflow via
  # this `changes` detector (skip-with-success) instead. See docs/ops/ci-workflow.md
  # and .github/instructions/workflows.instructions.md.
  changes:
    uses: ./.github/workflows/reusable-detect-changes.yml
    with:
      filters: |
        relevant:
          - '**/*.ts'
          - '**/*.tsx'
          - '**/*.js'
          - '**/*.jsx'
          - '**/*.mjs'
          - '**/*.cjs'
          - '**/*.json'
          - '**/*.css'
          - '**/*.html'
          - '**/*.yaml'
          - '**/*.yml'
          - '.eslintrc*'
          - 'eslint.config.*'
          - '.prettierrc*'
          - '.prettierignore'
          - 'package.json'
          - 'package-lock.json'
          - 'apps/**'
          - 'packages/**'
          - 'services/**'
          - '.github/workflows/ci-lint.yml'
          - '.github/workflows/reusable-detect-changes.yml'

  eslint-prettier:
    name: ESLint & Prettier
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache ESLint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'package-lock.json') }}-
            eslint-${{ runner.os }}-

      - name: ESLint
        run: npx eslint . --max-warnings 0 --cache --cache-location .eslintcache

      - name: Vendored engineering configs match lock
        run: node scripts/vendor-configs.mjs --check

      - name: Prettier
        run: npx prettier --check .

      - name: Validate financial-terminology glossary
        run: node scripts/i18n/validate-glossary.js

  pr-title:
    name: Semantic PR Title
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false

  observability-guardrails:
    name: Observability Guardrails
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLOCKING / REQUIRED (#2876): the "Check for sensitive data logging" step
    # below fails the build (exit 1) when financial/PII data is logged. This job
    # is intentionally NOT continue-on-error. Note: this workflow is path-filtered,
    # so the gatekeeper job in ci-security.yml runs an always-on backstop of the
    # same check for PRs that don't touch the filtered paths.

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for console logging in production code
        # The `|| echo ""` below is load-bearing, not defensive noise: grep exits 1
        # when it matches nothing, which here is the SUCCESS case. Without it the
        # step goes red on a clean repository (and under `-o pipefail`, on any
        # stage of the pipe matching nothing). Verified: clean=0, violation=1,
        # `// SAFE:`=0, `.spec.`=0. Do not "simplify" it away.
        run: |
          CONSOLE_HITS=$(grep -rn 'console\.log\|console\.warn\|console\.error' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            apps/web/src/ services/api/src/ packages/*/src/ 2>/dev/null \
            | grep -v '\.test\.' \
            | grep -v '\.spec\.' \
            | grep -v '__tests__' \
            | grep -v 'node_modules' \
            | grep -v '// eslint-disable' \
            || echo "")

          echo "### 📋 Observability Guardrails" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CONSOLE_HITS" ]; then
            COUNT=$(echo "$CONSOLE_HITS" | wc -l)
            echo "⚠️ Found **$COUNT** raw console logging call(s) in production code." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$CONSOLE_HITS" | head -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Found $COUNT raw console logging call(s) in production code"
          else
            echo "✅ No raw console logging found in production code." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for sensitive data logging
        # See the note on the previous step: the `|| echo ""` absorbs grep's
        # exit 1 (no match), which is this check's success case. Removing it
        # inverts the gate — it would fail on repositories with no violations.
        run: |
          SENSITIVE_PATTERNS=(
            'password'
            'access_token'
            'refresh_token'
            'api_key'
            'apiKey'
            'secret'
            'creditCard'
            'credit_card'
            'ssn'
            'social_security'
          )

          SENSITIVE_VIOLATIONS=0
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            HITS=$(grep -rn "console\.\|log\.\|logger\.\|Log\." \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
              --include='*.kt' --include='*.swift' \
              apps/ packages/ services/ 2>/dev/null \
              | grep -i "$pattern" \
              | grep -v '\.test\.' \
              | grep -v '\.spec\.' \
              | grep -v 'node_modules' \
              | grep -v '// SAFE:' \
              | grep -v '# nosec' \
              || echo "")

            if [ -n "$HITS" ]; then
              COUNT=$(echo "$HITS" | wc -l)
              SENSITIVE_VIOLATIONS=$((SENSITIVE_VIOLATIONS + COUNT))
              echo "::error::Potential sensitive data in logs matching '$pattern' ($COUNT occurrences)"
            fi
          done

          if [ "$SENSITIVE_VIOLATIONS" -eq 0 ]; then
            echo "✅ No sensitive-data logging patterns found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Sensitive-data logging patterns were detected ($SENSITIVE_VIOLATIONS occurrences)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check source map configuration
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Source map configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if grep -r 'sourcemap\|sourceMap\|source-map' apps/web/vite.config.* 2>/dev/null | grep -v node_modules > /dev/null; then
            echo "- ✅ Web: Source maps configured in Vite" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ Web: No source map configuration found" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # ENG-* citation integrity
  # ---------------------------------------------------------------------------
  # Deliberately has NO `needs: changes` gate, unlike every other job in this
  # workflow. The other jobs check finance's files against finance's rules, so
  # "no relevant file changed" genuinely means "nothing to check". This one
  # checks finance's citations against ANOTHER repository's principle index,
  # which moves on its own: an upstream rename can invalidate a citation on a PR
  # that touches nothing at all. Gating it on changed paths would make it absent
  # exactly when it is most needed, which is the always-on backstop pattern
  # already used for the sensitive-logging grep in ci-security.yml.
  #
  # No `npm ci`: the checker is a dependency-free Node script, so the job is
  # checkout + node + run. It fetches the principle index over the network and
  # THROWS on failure (exit 2) rather than reporting success, so an outage is
  # loud. That is deliberate — a verifier that passes when it cannot verify is
  # indistinguishable from one that verified.
  eng-citations:
    name: ENG Citations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # Catches a hand-edited vendored file. The checker is vendored from
      # jrmoulckers/engineering at a pinned tag and content-hashed in
      # engineering-configs.lock.json, because upstream's own header says it is
      # "kept nowhere" -- and a local copy declaring the same TOOL_VERSION as a
      # newer upstream one is how finance ran a checker missing a whole check.
      - name: Verify vendored tooling matches the lock
        run: npm run eng:vendor:check

      - name: Check ENG-* citations
        run: npm run eng:citations
