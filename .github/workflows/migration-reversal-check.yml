# =============================================================================
# Migration Reversal Check — every up migration needs a matching down migration
# =============================================================================
#
# Verifies that every services/api/supabase/migrations/*.sql has a matching
# services/api/supabase/migrations/down/<name>.down.sql. Fails (exit 1) if any
# reverse migration is missing, so rollbacks stay reliable.
#
# Supports audit issue #2881.
# =============================================================================
name: Migration Reversal Check

on:
  pull_request:
    paths:
      - 'services/api/supabase/migrations/**'
      - 'tools/check-migration-reversals.js'
  workflow_dispatch:

concurrency:
  group: migration-reversal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reversals:
    name: Reverse Migration Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3 (verified 2026-06-21)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 (verified 2026-06-21)
        with:
          node-version: 22

      - name: Check reverse migrations
        run: node tools/check-migration-reversals.js
