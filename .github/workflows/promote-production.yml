name: Promote to Production

on:
  workflow_run:
    workflows: ['Deploy — Staging']
    types: [completed]
    branches: [main]

concurrency:
  group: promote-production-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  deployments: write
  # Required so the reusable deploy-production.yml call is not rejected at
  # startup: its verify-ci-green job requests actions:read, and a called
  # workflow cannot escalate a scope above the caller's grant.
  actions: read

jobs:
  promote:
    name: Promote green staging commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/deploy-production.yml
    with:
      version: ${{ github.event.workflow_run.head_sha }}
      component: all
      rollback: false
      reason: >-
        Automated promotion after successful staging deploy run
        ${{ github.event.workflow_run.id }} for
        ${{ github.event.workflow_run.head_sha }}
      create_release: true
      auto_rollback: true
    # Explicit workflow_call contract: do not expose unrelated repository secrets.
    secrets:
      BANK_ENCRYPTION_KEY: ${{ secrets.BANK_ENCRYPTION_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      MX_WEBHOOK_SECRET: ${{ secrets.MX_WEBHOOK_SECRET }}
      MX_CLIENT_ID: ${{ secrets.MX_CLIENT_ID }}
      MX_API_KEY: ${{ secrets.MX_API_KEY }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
