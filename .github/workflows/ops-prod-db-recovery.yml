# =============================================================================
# Ops — Production DB recovery
# =============================================================================
#
# Read-only diagnostics and recovery for the self-hosted production stack when
# DB-dependent services return 502. Every Docker call is wrapped in `timeout`
# so an unresponsive Docker daemon cannot wedge the job (an earlier plain
# `docker compose ps` hung for 15 min → job cancelled).
#
#   diagnose        (default) read-only: uptime, disk, memory, sudo probe,
#                   dockerd state, `docker info`/`ps` (timeout-guarded), and —
#                   when passwordless sudo is available — recent docker journal
#                   and kernel OOM lines. Makes NO changes.
#   diagnose-bank-data
#                   Read-only aggregate counts for the bank-data pipeline. Does
#                   not output account names, transaction data, or identifiers.
#   up              `docker compose up -d` (idempotent; data volumes untouched).
#   restart-db      `docker compose restart db`, then tail db logs.
#   restart-docker  `sudo systemctl restart docker` (fixes a hung daemon), then
#                   `docker compose up -d`. Requires passwordless sudo.
#   repair-household-memberships
#                   Backfill missing active owner memberships from each
#                   household's verified `created_by` identity.
#   repair-bank-connectivity-schema
#                   Apply the missing bank-connectivity foundation and provider
#                   seed, then reset Plaid cursors for a lossless re-ingestion.
#   reboot          `sudo systemctl reboot` (last resort for a wedged host).
#                   Requires passwordless sudo; containers with a restart policy
#                   come back automatically on boot.
#
# Runs over the same SSH path the deploy uses (DEPLOY_HOST / DEPLOY_SSH_KEY /
# DEPLOY_USER), gated by the `production` environment.
# =============================================================================

name: Ops — Production DB recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do on the production VM'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - diagnose-bank-data
          - up
          - restart-db
          - restart-docker
          - repair-household-memberships
          - repair-bank-connectivity-schema
          - reboot

concurrency:
  group: ops-prod-db-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    name: ${{ inputs.action }} on production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
    steps:
      - name: Run ops action over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/finance' }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo '::error::DEPLOY_HOST not configured — cannot reach the production server.'
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # ACTION comes from a fixed choice list (no injection); pass it plus
          # DEPLOY_PATH on the command line and keep the body in a quoted heredoc.
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' ACTION='$ACTION' bash -s" <<'REMOTE'
            set -u
            case "$DEPLOY_PATH" in "~"|"~/"*) DEPLOY_PATH="${HOME}${DEPLOY_PATH#"~"}" ;; esac
            cd "$DEPLOY_PATH" 2>/dev/null || true
            echo "[remote] connected to $(hostname); action=$ACTION; path=$DEPLOY_PATH"

            DC="docker compose -f deploy/docker-compose.yml"
            HAVE_SUDO=no
            if sudo -n true 2>/dev/null; then HAVE_SUDO=yes; fi

            echo "=== uptime / load ==="; uptime </dev/null 2>&1 || true
            echo "=== disk ==="; df -h </dev/null 2>&1 || true
            echo "=== memory (MiB) ==="; free -m </dev/null 2>&1 || true
            echo "=== passwordless sudo: $HAVE_SUDO ==="
            echo "=== dockerd active: $(systemctl is-active docker 2>/dev/null || echo unknown) ==="
            echo "=== docker info (timeout 20) ==="; timeout 20 docker info </dev/null 2>&1 | head -35 || echo "(docker info timed out/failed)"
            echo "=== compose ps (timeout 25) ==="; timeout 25 $DC ps </dev/null 2>&1 || echo "(compose ps timed out/failed)"

            case "$ACTION" in
              diagnose)
                if [ "$HAVE_SUDO" = yes ]; then
                  echo "=== docker journal (last 40) ==="; sudo journalctl -u docker --no-pager -n 40 </dev/null 2>&1 | tail -40 || true
                  echo "=== kernel OOM / killed (last 20) ==="; sudo dmesg </dev/null 2>&1 | grep -iE "oom|killed process|out of memory" | tail -20 || echo "(none)"
                fi
                echo "=== db logs (timeout 25, tail 120) ==="; timeout 25 $DC logs db --tail=120 --no-color </dev/null 2>&1 || echo "(db logs timed out/failed)"
                echo "=== edge-functions bank env presence (values redacted) ==="
                timeout 20 $DC exec -T edge-functions sh -c '
                  for key in PLAID_CLIENT_ID PLAID_SECRET PLAID_ENVIRONMENT PLAID_WEBHOOK_URL BANK_ENCRYPTION_KEY MX_CLIENT_ID MX_API_KEY MX_ENVIRONMENT MX_WEBHOOK_SECRET; do
                    eval "value=\${$key:-}"
                    if [ -n "$value" ]; then echo "$key=<set>"; else echo "$key=<missing>"; fi
                  done
                ' </dev/null 2>&1 || echo "(edge-functions env probe timed out/failed)"
                echo "=== edge-functions logs (timeout 25, tail 160) ==="
                timeout 25 $DC logs edge-functions --tail=160 --no-color </dev/null 2>&1 \
                  | sed -E 's/(access_token|public_token|client_id|secret|authorization)(["=: ]+)[^", }]+/\1\2<redacted>/Ig' \
                  || echo "(edge-functions logs timed out/failed)"
                ;;
              diagnose-bank-data)
                echo "=== bank-data aggregate counts (no financial data or identifiers) ==="
                count_metric() {
                  metric="$1"
                  query="$2"
                  if result=$(timeout 20 $DC exec -T db psql \
                    -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
                    -At -c "$query" </dev/null 2>&1); then
                    printf '%-38s %s\n' "$metric" "$result"
                  else
                    printf '%-38s unavailable (%s)\n' "$metric" "$(echo "$result" | head -1)"
                  fi
                }
                count_metric enabled_providers \
                  "SELECT count(*) FROM public.aggregator_providers WHERE is_enabled"
                count_metric bank_connections \
                  "SELECT count(*) FROM public.bank_connections WHERE deleted_at IS NULL"
                count_metric connections_with_sync_cursor \
                  "SELECT count(*) FROM public.bank_connections WHERE deleted_at IS NULL AND metadata->>'cursor' IS NOT NULL"
                count_metric linked_connection_accounts \
                  "SELECT count(*) FROM public.bank_connection_accounts WHERE is_linked"
                count_metric internal_accounts_for_connections \
                  "SELECT count(DISTINCT bca.account_id)
                   FROM public.bank_connection_accounts bca
                   JOIN public.bank_connections bc ON bc.id = bca.bank_connection_id
                   JOIN public.accounts a ON a.id = bca.account_id
                   WHERE bca.is_linked AND bc.deleted_at IS NULL AND a.deleted_at IS NULL"
                count_metric transactions_for_linked_accounts \
                  "SELECT count(DISTINCT t.id)
                   FROM public.bank_connection_accounts bca
                   JOIN public.bank_connections bc ON bc.id = bca.bank_connection_id
                   JOIN public.transactions t ON t.account_id = bca.account_id
                   WHERE bca.is_linked AND bc.deleted_at IS NULL AND t.deleted_at IS NULL"
                count_metric connection_health_events \
                  "SELECT count(*) FROM public.bank_connection_health"
                count_metric bank_sync_log_entries \
                  "SELECT count(*) FROM public.bank_sync_log"
                ;;
              up)
                echo "=== docker compose up -d (timeout 180) ==="; timeout 180 $DC up -d </dev/null 2>&1 || echo "(up timed out/failed)"
                sleep 8
                echo "=== ps after up (timeout 25) ==="; timeout 25 $DC ps </dev/null 2>&1 || true
                ;;
              restart-db)
                echo "=== docker compose restart db (timeout 120) ==="; timeout 120 $DC restart db </dev/null 2>&1 || echo "(restart timed out/failed)"
                sleep 8
                echo "=== db logs (timeout 25, tail 80) ==="; timeout 25 $DC logs db --tail=80 --no-color </dev/null 2>&1 || true
                ;;
              restart-docker)
                if [ "$HAVE_SUDO" != yes ]; then echo "::error::passwordless sudo unavailable — cannot restart the docker daemon"; exit 1; fi
                echo "=== systemctl restart docker ==="; sudo systemctl restart docker </dev/null 2>&1 || { echo "::error::docker restart failed"; exit 1; }
                sleep 12
                echo "=== dockerd active: $(systemctl is-active docker 2>/dev/null) ==="
                echo "=== docker compose up -d (timeout 180) ==="; timeout 180 $DC up -d </dev/null 2>&1 || echo "(up timed out/failed)"
                sleep 8
                echo "=== ps after restart (timeout 25) ==="; timeout 25 $DC ps </dev/null 2>&1 || true
                ;;
              repair-household-memberships)
                echo "=== repair missing household owner memberships ==="
                timeout 30 $DC exec -T db psql \
                  -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
                  -c "UPDATE public.household_members hm
                      SET role = 'owner', updated_at = now()
                      FROM public.households h
                      WHERE hm.household_id = h.id
                        AND hm.user_id = h.created_by
                        AND hm.deleted_at IS NULL
                        AND h.deleted_at IS NULL
                        AND hm.role <> 'owner';
                      INSERT INTO public.household_members (household_id, user_id, role)
                      SELECT h.id, h.created_by, 'owner'
                      FROM public.households h
                      WHERE h.deleted_at IS NULL
                        AND NOT EXISTS (
                          SELECT 1
                          FROM public.household_members hm
                          WHERE hm.household_id = h.id
                            AND hm.user_id = h.created_by
                            AND hm.deleted_at IS NULL
                        )
                      ON CONFLICT DO NOTHING;" </dev/null
                ;;
              repair-bank-connectivity-schema)
                foundation="services/api/supabase/migrations/20260331000001_bank_connectivity_foundation.sql"
                provider_seed="services/api/supabase/migrations/20260401000003_seed_aggregator_providers_phase3.sql"
                if [ ! -f "$foundation" ] || [ ! -f "$provider_seed" ]; then
                  echo "::error::bank connectivity migration files are missing from the deployed checkout"
                  exit 1
                fi

                foundation_state=$(timeout 20 $DC exec -T db psql \
                  -U supabase_admin -d postgres -At -F '|' \
                  -c "SELECT
                        to_regclass('public.aggregator_providers') IS NOT NULL,
                        to_regclass('public.bank_connection_health') IS NOT NULL,
                        EXISTS (
                          SELECT 1 FROM information_schema.columns
                          WHERE table_schema = 'public'
                            AND table_name = 'transactions'
                            AND column_name = 'provider_transaction_id'
                        ),
                        EXISTS (
                          SELECT 1 FROM information_schema.columns
                          WHERE table_schema = 'public'
                            AND table_name = 'bank_connections'
                            AND column_name = 'aggregator_provider_id'
                        )" </dev/null)
                case "$foundation_state" in
                  't|t|t|t')
                    echo "=== bank connectivity foundation already present; skipping ==="
                    ;;
                  'f|f|f|f')
                    echo "=== apply bank connectivity foundation in one transaction ==="
                    timeout 90 $DC exec -T db psql \
                      -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -1 \
                      -f - <"$foundation"
                    ;;
                  *)
                    echo "::error::bank connectivity foundation is partially applied ($foundation_state); refusing an unsafe replay"
                    exit 1
                    ;;
                esac

                echo "=== upsert aggregator provider registry ==="
                timeout 30 $DC exec -T db psql \
                  -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -1 \
                  -f - <"$provider_seed"

                echo "=== reset Plaid cursors for lossless re-ingestion ==="
                timeout 30 $DC exec -T db psql \
                  -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
                  -c "UPDATE public.bank_connections
                      SET metadata = metadata - 'cursor',
                         last_synced_at = NULL,
                         updated_at = now()
                      WHERE provider = 'plaid'
                       AND deleted_at IS NULL;" </dev/null
                ;;
              reboot)
                if [ "$HAVE_SUDO" != yes ]; then echo "::error::passwordless sudo unavailable — cannot reboot"; exit 1; fi
                echo "=== rebooting host (containers with a restart policy return on boot) ==="
                sudo systemctl reboot </dev/null 2>&1 || sudo reboot </dev/null 2>&1 || true
                echo "reboot signalled"
                ;;
            esac
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
