# =============================================================================
# Update Visual Snapshots — regenerate Playwright visual baselines on Linux
# =============================================================================
#
# Playwright screenshot baselines are OS-specific (font/AA rendering differs
# between Windows/macOS and the Linux CI runners). Baselines therefore MUST be
# generated on the same OS that runs the assertions (ubuntu-latest).
#
# Run this manually (workflow_dispatch) after an intentional UI change to the
# snapshotted surfaces. It rebuilds the web app, runs the visual-regression
# spec with --update-snapshots on Chromium, and commits the refreshed PNG(s)
# back to the triggering branch.
# =============================================================================

name: Update Visual Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Regenerate visual baselines (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -w packages/design-tokens

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://e2e-test.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-test-anon-key
        run: npm run build -w apps/web

      - name: Install Playwright browser
        run: npx -w apps/web playwright install --with-deps chromium

      - name: Update visual snapshots
        env:
          CI: 'true'
          VITE_SUPABASE_URL: https://e2e-test.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-test-anon-key
        run: |
          npx -w apps/web playwright test e2e/visual-regression.spec.ts \
            --project=chromium --update-snapshots

      - name: Open PR with refreshed baselines
        env:
          # Disable husky hooks: the repo's pre-push hook requires interactive
          # confirmation, which hangs/fails in CI. --no-verify is belt-and-braces.
          HUSKY: '0'
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- 'apps/web/e2e/**/*.png'; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          # main is a protected branch (PRs required), so land the refreshed
          # baselines via a PR rather than a direct push.
          BRANCH="chore/visual-baselines-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/web/e2e/**/*.png
          git commit --no-verify -m "test(web): refresh Chromium visual baselines"
          git push --no-verify origin "$BRANCH"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "test(web): refresh Chromium visual baselines" \
            --body "Automated refresh of the Linux Chromium visual baselines, generated by the **Update Visual Snapshots** workflow. Merge to make the visual-regression check green on \`main\`."
