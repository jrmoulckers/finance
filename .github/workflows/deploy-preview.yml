# =============================================================================
# Preview Deployments — per-PR preview environments
# =============================================================================
#
# Builds the web app for pull requests, deploys preview URLs, comments on the PR, and cleans up aliases when the PR closes.
# =============================================================================
# =============================================================================
# Preview Deployments — Per-PR Staging URLs for Web App
# =============================================================================
#
# Deploys web app builds from pull requests to unique preview URLs via Vercel,
# giving reviewers instant access to a live staging environment.
#
# Features:
#   - Unique preview URL per PR
#   - PR comment with deployment URL and status
#   - Lighthouse CI audit on preview URL
#   - GitHub Deployment status integration
#   - Auto-cleanup on PR close
#   - Only deploys after required checks pass
#
# Issue: #1018
# =============================================================================

name: Deploy — Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/web/**'
      - 'packages/design-tokens/**'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy preview for'
        required: true
        type: number

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Build: Run PR-controlled code without secrets or write-capable permissions.
  # ---------------------------------------------------------------------------
  build-preview:
    name: Build Preview
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run build -w packages/design-tokens

      - name: Build web app (preview)
        env:
          NODE_ENV: production
          VITE_APP_VERSION: pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}-${{ github.sha }}
          VITE_ENVIRONMENT: preview
        run: |
          BUILD_START=$SECONDS
          npm run build -w apps/web
          echo "build_duration=$(( SECONDS - BUILD_START ))" >> "$GITHUB_OUTPUT"

      - name: Reject unsafe preview artifacts
        run: |
          set -euo pipefail
          test -d apps/web/dist
          if find apps/web/dist -type l -print -quit | grep -q .; then
            echo "::error::Preview artifacts must not contain symbolic links"
            exit 1
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Deploy: Consume inert build output; never check out or execute PR code here.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy Preview
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}

    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-dist
          path: apps/web/dist

      - name: Deploy to Vercel (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUM" =~ ^[1-9][0-9]{0,9}$ ]] ||
            { echo "::error::Invalid pull request number"; exit 1; }
          [[ ${#HEAD_REF} -le 255 && "$HEAD_REF" != *$'\n'* && "$HEAD_REF" != *$'\r'* ]] ||
            { echo "::error::Invalid head ref"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::Invalid source commit SHA"; exit 1; }
          test -d apps/web/dist
          if find apps/web/dist -type l -print -quit | grep -q .; then
            echo "::error::Preview artifacts must not contain symbolic links"
            exit 1
          fi

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not configured; skipping the optional preview deployment"
            echo "### Preview deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel credentials are not configured for this repository." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm install --global vercel@58.9.0

          # Deploy to preview with PR-specific alias. Use a tempfile so we
          # check the exit code separately from the URL parse — piping into
          # `tail` previously swallowed Vercel failures silently.
          set -o pipefail
          DEPLOY_LOG="$RUNNER_TEMP/vercel-preview-${PR_NUM}.log"
          if ! vercel deploy \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes \
            --archive=tgz \
            --meta pr="${PR_NUM}" \
            --meta commit="$SOURCE_SHA" \
            --meta branch="$HEAD_REF" \
            apps/web/dist >"$DEPLOY_LOG" 2>&1; then
            echo "::error::Vercel preview deploy failed:"
            cat "$DEPLOY_LOG"
            exit 1
          fi
          DEPLOY_URL=$(tail -1 "$DEPLOY_LOG")
          [[ "$DEPLOY_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]] ||
            { echo "::error::Vercel returned an invalid deployment URL"; exit 1; }

          # Set alias for predictable URL
          ALIAS_URL="finance-pr-${PR_NUM}.vercel.app"
          vercel alias set "$DEPLOY_URL" "$ALIAS_URL" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" 2>&1 || true

          PREVIEW_URL="https://${ALIAS_URL}"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Comment: Post preview URL to PR
  # ---------------------------------------------------------------------------
  comment:
    name: PR Comment
    needs: deploy-preview
    if: github.event.action != 'closed' && needs.deploy-preview.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Find existing comment
        id: find-comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('Invalid pull request number');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- preview-deploy -->')
            );

            core.setOutput('comment_id', botComment ? botComment.id : '');

      - name: Create or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REF: ${{ github.head_ref }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          SOURCE_SHA: ${{ github.sha }}
          COMMENT_ID: ${{ steps.find-comment.outputs.comment_id }}
        with:
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const url = process.env.PREVIEW_URL;
            const sha = process.env.SOURCE_SHA.slice(0, 7);
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('Invalid pull request number');
              return;
            }
            if (!/^https:\/\/[A-Za-z0-9.-]+\.vercel\.app\/?$/.test(url)) {
              core.setFailed('Invalid preview URL');
              return;
            }

            const body = [
              '<!-- preview-deploy -->',
              '## 🚀 Preview Deployment',
              '',
              `| | |`,
              `|---|---|`,
              `| **URL** | [${url}](${url}) |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Branch** | \`${process.env.HEAD_REF}\` |`,
              `| **Status** | ✅ Deployed |`,
              '',
              '---',
              '*Updated on every push to this PR. Preview will be removed when the PR is closed.*',
            ].join('\n');

            const commentId = process.env.COMMENT_ID;

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: parseInt(commentId),
                body,
              });
              core.info(`Updated existing comment: ${commentId}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info('Created new preview deployment comment');
            }

  # ---------------------------------------------------------------------------
  # Lighthouse: Audit preview deployment
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse Audit
    needs: deploy-preview
    if: github.event.action != 'closed' && needs.deploy-preview.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Non-blocking: preview URL may not be immediately accessible
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for deployment
        id: wait
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          set -euo pipefail
          URL="$PREVIEW_URL"
          [[ "$URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]] ||
            { echo "::error::Invalid preview URL"; exit 1; }
          echo "Waiting for $URL to become accessible..."

          for i in $(seq 1 12); do
            if curl -sf -o /dev/null "$URL" 2>/dev/null; then
              echo "✅ Preview is accessible"
              exit 0
            fi
            echo "Attempt $i/12 — waiting 10s..."
            sleep 10
          done

          echo "::warning::Preview URL not accessible after 2 minutes — skipping Lighthouse"
          echo "preview_accessible=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Lighthouse Audit
        id: lighthouse
        if: steps.wait.outputs.preview_accessible != 'false'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        continue-on-error: true
        with:
          urls: ${{ needs.deploy-preview.outputs.url }}
          uploadArtifacts: true
          runs: 1

      - name: Lighthouse Summary
        if: always()
        env:
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          echo "### 🔦 Lighthouse Audit (Preview)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Preview URL:** $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LIGHTHOUSE_OUTCOME" = "success" ]; then
            echo "✅ Lighthouse audit completed — check artifacts for full report." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Lighthouse audit could not complete (preview may not be accessible)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Cleanup: Remove preview on PR close
  # ---------------------------------------------------------------------------
  cleanup:
    name: Cleanup Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: write
      pull-requests: write
    environment:
      name: preview

    steps:
      - name: Remove preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUM" =~ ^[1-9][0-9]{0,9}$ ]] ||
            { echo "::error::Invalid pull request number"; exit 1; }
          echo "### 🧹 Preview Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not configured — no cleanup needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm install --global vercel@58.9.0

          # Remove the alias
          ALIAS_URL="finance-pr-${PR_NUM}.vercel.app"
          vercel alias rm "$ALIAS_URL" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes 2>&1 || true

          echo "✅ Preview alias \`${ALIAS_URL}\` removed." >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('Invalid pull request number');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- preview-deploy -->')
            );

            if (botComment) {
              const body = [
                '<!-- preview-deploy -->',
                '## 🚀 Preview Deployment',
                '',
                '~~Preview has been removed~~ — PR was closed.',
                '',
                '---',
                '*Preview environments are automatically cleaned up when PRs are closed.*',
              ].join('\n');

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            }
