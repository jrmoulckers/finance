# =============================================================================
# Reusable Release Smoke Test — Pre-release validation for all platforms
# =============================================================================
#
# Runs quick sanity checks against built artifacts to verify they are functional
# before promoting to production or advancing a staged rollout.
#
# This is a Finance-local copy awaiting removal — not a defended deviation.
# Canon now ships `reusable-native-smoke-test.yml` in jrmoulckers/.github with
# the same shape as this file: a `validate` job, one job per platform selected
# through a `platforms` input (android/ios/web/windows), and a `summary` job
# reducing the per-platform verdicts to one gateable `result` output. It was
# promoted into canon *from this workflow* (jrmoulckers/.github#113), so the
# Finance delta is zero and migrating drops no platform coverage.
#
# The file was renamed from `reusable-smoke-test.yml` to
# `reusable-release-smoke-test.yml` to clear a filename collision with canon's
# unrelated web-only `reusable-smoke-test.yml` — see jrmoulckers/.github#60.
# Finance still calls this copy only via a relative
# `uses: ./.github/workflows/...` path and consumes no backbone version yet.
#
# Migration is sequenced, not settled: finance's `optIn.workflows` in the
# backbone `studio.config.json` is `[]` and the sync manifest fails validation
# on undeclared uses, so repointing rc-branch-tag.yml and release-train.yml at
# the canonical workflow must wait for jrmoulckers/.github#118. Tracked by #4364.
# Canonical comparison: jrmoulckers/.github@f0bacf77dbdf0f5394793031875700b515ac2a1d
#
# Called by: rc-branch-tag.yml, release-train.yml
#
# Issue: #1147, #4362, jrmoulckers/.github#60
# =============================================================================

name: Reusable Release Smoke Test

on:
  workflow_call:
    inputs:
      version:
        description: 'Version being tested (e.g. 2.0.0-rc.1)'
        required: true
        type: string
      platforms:
        description: 'Comma-separated list of platforms to test (android,ios,web,windows)'
        required: false
        type: string
        default: 'android,ios,web,windows'
      artifact-run-id:
        description: 'Run ID to download artifacts from (blank = current run)'
        required: false
        type: string
        default: ''
    secrets:
      TURBO_TEAM:
        required: false
      TURBO_TOKEN:
        required: false
    outputs:
      result:
        description: 'Overall smoke test result (pass/fail)'
        value: ${{ jobs.summary.outputs.result }}

permissions: {}

jobs:
  validate:
    name: Validate smoke inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate inputs
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          PLATFORMS: ${{ inputs.platforms }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::version must be SemVer-compatible"; exit 1; }
          [[ "$PLATFORMS" =~ ^(android|ios|web|windows)(,(android|ios|web|windows))*$ ]] ||
            { echo "::error::platforms must be a comma-separated supported platform list"; exit 1; }
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] ||
              { echo "::error::artifact-run-id must be a positive integer"; exit 1; }
          fi

  # ── Android Smoke Tests ──────────────────────────────────────────
  android:
    name: Android Smoke
    if: contains(inputs.platforms, 'android')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # The wrapper fetches the distribution with no retry and a 10s network
      # timeout, so a transient reset from services.gradle.org fails the build
      # step before a single line is compiled. Fetching here keeps the retry
      # scoped to the download: a build failure still fails on the first attempt.
      - name: Prefetch Gradle distribution
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle distribution fetch failed (attempt ${attempt}/3)"
            sleep $(( attempt * 15 ))
          done
          echo "::error::Gradle distribution unavailable after 3 attempts"
          exit 1
      - name: Run unit tests
        run: |
          ./gradlew :apps:android:testReleaseUnitTest \
            --parallel --build-cache --stacktrace

      - name: Run lint checks
        run: |
          ./gradlew :apps:android:lintRelease \
            --parallel --build-cache --stacktrace
        continue-on-error: true

      - name: Verify APK builds
        run: |
          ./gradlew :apps:android:assembleRelease \
            --parallel --build-cache --stacktrace
          APK=$(find apps/android/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          echo "✅ Release APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Smoke test summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "### 🤖 Android Smoke Test — v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK build: ✅" >> "$GITHUB_STEP_SUMMARY"

  # ── iOS Smoke Tests ──────────────────────────────────────────────
  ios:
    name: iOS Smoke
    if: contains(inputs.platforms, 'ios')
    needs: validate
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Resolve SPM dependencies
        run: |
          # `set -o pipefail` is REQUIRED wherever xcodebuild is piped into `tail`.
          # GitHub Actions' default shell is `bash -e` *without* pipefail, so the
          # step's exit status would be `tail`'s — always 0 — and a failed build
          # would report success. See #4122.
          set -o pipefail
          cd apps/ios
          xcodebuild -resolvePackageDependencies \
            -scheme FinanceApp \
            -clonedSourcePackagesDirPath .spm-packages \
            2>&1 | tail -10

      - name: Build for simulator
        run: |
          set -o pipefail
          cd apps/ios
          xcodebuild build \
            -scheme FinanceApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath .spm-packages \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20

      - name: Run tests
        run: |
          set -o pipefail
          cd apps/ios
          # The SPM-generated `<PackageName>-Package` scheme is the one carrying
          # the test targets; `FinanceApp` is a library product.
          xcodebuild test \
            -scheme Finance-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath .spm-packages \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -30

      - name: Smoke test summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "### 🍎 iOS Smoke Test — v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ✅" >> "$GITHUB_STEP_SUMMARY"

  # ── Web Smoke Tests ──────────────────────────────────────────────
  web:
    name: Web Smoke
    if: contains(inputs.platforms, 'web')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run build -w packages/design-tokens

      - name: Build web app
        run: npm run build -w apps/web
        env:
          VITE_APP_VERSION: ${{ inputs.version }}

      - name: Run unit tests
        run: npm test -w apps/web

      - name: Check bundle size
        run: |
          MAX_SIZE_KB=2048
          DIST_SIZE=$(du -sk apps/web/dist/ | cut -f1)
          echo "Bundle size: ${DIST_SIZE}KB (budget: ${MAX_SIZE_KB}KB)"
          if [ "$DIST_SIZE" -gt "$MAX_SIZE_KB" ]; then
            echo "::warning::Bundle size ${DIST_SIZE}KB exceeds budget ${MAX_SIZE_KB}KB"
          fi

      - name: Smoke test summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "### 🌐 Web Smoke Test — v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ✅" >> "$GITHUB_STEP_SUMMARY"

  # ── Windows Smoke Tests ──────────────────────────────────────────
  windows:
    name: Windows Smoke
    if: contains(inputs.platforms, 'windows')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # The wrapper fetches the distribution with no retry and a 10s network
      # timeout, so a transient reset from services.gradle.org fails the build
      # step before a single line is compiled. Fetching here keeps the retry
      # scoped to the download: a build failure still fails on the first attempt.
      - name: Prefetch Gradle distribution
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle distribution fetch failed (attempt ${attempt}/3)"
            sleep $(( attempt * 15 ))
          done
          echo "::error::Gradle distribution unavailable after 3 attempts"
          exit 1
      - name: Build application
        run: ./gradlew :apps:windows:build --parallel --build-cache --stacktrace

      - name: Run tests
        run: ./gradlew :apps:windows:test --parallel --build-cache --stacktrace

      - name: Smoke test summary
        if: always()
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "### 🪟 Windows Smoke Test — v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ✅" >> "$GITHUB_STEP_SUMMARY"

  # ── Summary ──────────────────────────────────────────────────────
  summary:
    name: Smoke Test Summary
    needs: [validate, android, ios, web, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Evaluate results
        id: result
        env:
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          VALIDATE: ${{ needs.validate.result }}
          VERSION: ${{ inputs.version }}
          WEB: ${{ needs.web.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "### 🧪 Smoke Test Results — v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          FAILED=false
          if [ "$VALIDATE" != "success" ]; then
            echo "::error::Smoke input validation did not pass"
            FAILED=true
          fi
          for PLATFORM in android ios web windows; do
            RESULT_VAR=$(echo "$PLATFORM" | tr '[:lower:]' '[:upper:]')
            RESULT="${!RESULT_VAR}"

            # Skipped platforms count as pass
            if [ "$RESULT" = "skipped" ] || [ "$RESULT" = "success" ]; then
              echo "| $PLATFORM | ✅ ${RESULT} |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $PLATFORM | ❌ ${RESULT} |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**❌ Smoke tests failed — do NOT proceed with release**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**✅ All smoke tests passed — safe to proceed**" >> "$GITHUB_STEP_SUMMARY"
          fi
