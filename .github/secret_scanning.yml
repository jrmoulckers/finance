# GitHub native secret scanning — path tuning (#2877)
# -----------------------------------------------------------------------------
# This file only TUNES GitHub Advanced Security's built-in secret scanning by
# ignoring known test/fixture paths to reduce false positives. The feature
# itself (Secret scanning + Push protection) must be ENABLED by an admin under
# Settings → Code security and analysis — see .github/branch-protection.md →
# "Needs Human Action". The blocking CI gate lives in ci-security.yml
# (gitleaks + TruffleHog) and does not depend on this file.
paths-ignore:
  - '**/*.test.*'
  - '**/test/**'
  - '**/__tests__/**'
